# Render Blueprint for the JeevanDoot backend.
# Create the service from this file (Render -> New -> Blueprint, pointing at
# the repo root) OR add a Web Service manually with root directory "backend".
services:
  - type: web
    name: jeevandoot-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: sqlite:///./jeevandoot.db
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: DEBUG
        value: "false"